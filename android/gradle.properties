qianjiPackage=com.zbb.qianji.mock
qianjiMainActivity=com.zbb.qianji.mock.MainActivity

# 🆕 08-24 (老板拍板 a=方案A): APP_ENV 变量控制 JS bundle 注入 (production / mock)
